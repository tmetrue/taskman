micronaut:
  application:
    name: taskman
  server:
    port: 8888
    cors:
      enabled: true

datasources:
  default:
    url: ${JDBC_URL:`jdbc:postgresql://localhost:5432/taskman`}
    username: ${JDBC_USER:postgres}
    password: ${JDBC_PASSWORD:postgres}
    driverClassName: org.postgresql.Driver

flyway:
  datasources:
    default:
      enabled: true
      baseline-on-migrate: true

jpa:
  default:
    properties:
      hibernate:
        hbm2ddl:
          auto: none
        show_sql: true

endpoints:
  health:
    enabled: true
    sensitive: false