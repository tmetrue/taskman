micronaut:
  application:
    name: taskman
  server:
    port: 8888
    cors:
      enabled: true
  security:
    authentication: bearer
    token:
      jwt:
        signatures:
          secret:
            generator:
              secret: ${JWT_SECRET:pleaseChangeThisSecretForANewSecretAndMakeItSecure}
              jws-algorithm: HS256
        generator:
          access-token:
            expiration: 86400  # 1 day in seconds
    endpoints:
      login:
        enabled: true
      oauth:
        enabled: true
      logout:
        enabled: true

datasources:
  default:
    url: ${JDBC_URL:`jdbc:postgresql://localhost:5432/taskman`}
    username: ${JDBC_USER:postgres}
    password: ${JDBC_PASSWORD:postgres}
    driverClassName: org.postgresql.Driver

flyway:
  datasources:
    default:
      enabled: true
      baseline-on-migrate: true

jpa:
  default:
    properties:
      hibernate:
        hbm2ddl:
          auto: none
        show_sql: true

endpoints:
  health:
    enabled: true
    sensitive: false

cors:
  enabled: true
  allowed-origins:
    - "http://localhost:5174"
  allowed-methods:
    - "GET"
    - "POST"
    - "PUT"
    - "DELETE"
    - "OPTIONS"
  allowed-headers:
    - "Authorization"
    - "Content-Type"
  exposed-headers:
    - "Authorization"
  allow-credentials: true
  max-age: 3600